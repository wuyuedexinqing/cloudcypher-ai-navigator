<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Cypher - Dream Job Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Cloud Cypher</h1>
        <p>Create your dream job avatar!</p>
        
        <form id="dreamForm">
            <label for="age">Your Age:</label>
            <input type="number" id="age" min="1" max="100" required>
            
            <label for="dreamJob">Your Dream Job:</label>
            <select id="dreamJob" required>
                <option value="">Select a job</option>
                <option value="astronaut">Astronaut</option>
                <option value="doctor">Doctor</option>
                <option value="singer">Singer</option>
                <option value="programmer">Programmer</option>
            </select>
            
            <label for="photo">Upload Your Photo:</label>
            <input type="file" id="photo" accept="image/*" required>
            
            <button type="submit">Generate!</button>
        </form>
        
        <div id="result" style="display: none;">
            <h2>Your Dream Job Avatar</h2>
            <canvas id="canvas" width="300" height="400"></canvas>
            <button id="download">Download Image</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
