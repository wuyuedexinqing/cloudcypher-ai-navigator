<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold ETF vs BTC ETF Comparison</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Gold ETF vs Bitcoin ETF Performance Comparison</h1>
        
        <div class="chart-controls">
            <div class="time-selector">
                <label for="timeframe">Time Frame:</label>
                <select id="timeframe">
                    <option value="day">Day</option>
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                    <option value="quarter">Quarter</option>
                    <option value="year">Year</option>
                </select>
            </div>
            <div class="date-range">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate">
                <button id="updateChart">Update Chart</button>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="comparison-chart"></canvas>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color gold"></div>
                <span>Gold ETF (GLD) - Left Axis</span>
            </div>
            <div class="legend-item">
                <div class="legend-color btc"></div>
                <span>Bitcoin ETF (IBIT) - Right Axis</span>
            </div>
        </div>
        
        <div class="info-section">
            <h2>Data Comparison</h2>
            <table id="comparison-table">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th>Gold ETF (GLD)</th>
                        <th>Bitcoin ETF (IBIT)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Current Price</td>
                        <td id="gold-price">-</td>
                        <td id="btc-price">-</td>
                    </tr>
                    <tr>
                        <td>% Change (Selected Period)</td>
                        <td id="gold-change">-</td>
                        <td id="btc-change">-</td>
                    </tr>
                    <tr>
                        <td>Trading Volume (Avg)</td>
                        <td id="gold-volume">-</td>
                        <td id="btc-volume">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
